[package]
name = "forge-deck"
version = "0.3.0"
edition = "2024"
authors = ["Igor Kramar <i@ikramar.ru>"]
description = "A terminal workspace for GitHub and GitLab"
license = "MIT"
repository = "https://github.com/IgorKramar/forge-deck"
homepage = "https://github.com/IgorKramar/forge-deck"
readme = "README.md"
keywords = ["github", "gitlab", "tui", "terminal", "ratatui"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "gitlab_deck"

[dependencies]
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
libc = "0.2"
ratatui = "0.30.2"
serde_json = "1"
vte = "0.14"

[profile.release]
strip = true
lto = "thin"
