[package]
name = "gitlab-deck"
version = "0.1.0"
edition = "2024"
authors = ["Igor Kramar <i@ikramar.ru>"]
description = "Самостоятельный терминальный клиент GitLab"
repository = "https://github.com/IgorKramar/gitlab-deck"
homepage = "https://github.com/IgorKramar/gitlab-deck"
readme = "README.md"
keywords = ["gitlab", "tui", "terminal", "ci", "ratatui"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
libc = "0.2"
ratatui = "0.30.2"
serde_json = "1"
vte = "0.14"

[profile.release]
strip = true
lto = "thin"
